name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Icon
        run: |
          ICONSET=Assets.xcassets/AppIcon.appiconset
          SOURCE_ICON=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][0]["filename"])' "$ICONSET/Contents.json")
          test -f "$ICONSET/$SOURCE_ICON"
          sips -s format png "$ICONSET/$SOURCE_ICON" --out "$ICONSET/icon.png"
          python3 - "$ICONSET/Contents.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as file:
              data = json.load(file)
          for image in data["images"]:
              image["filename"] = "icon.png"
          with open(path, "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")
          PY

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' SimpleBrowser.xcodeproj/project.pbxproj || true

      - name: Build Application
        run: |
          set -o pipefail
          xcodebuild build \
            -project SimpleBrowser.xcodeproj \
            -scheme SimpleBrowser \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee xcodebuild.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-Build-Log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SimpleBrowser.app Payload/
          zip -qr SimpleBrowser.ipa Payload

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-IPA
          path: SimpleBrowser.ipa
