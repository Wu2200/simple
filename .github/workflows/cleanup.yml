name: Cleanup

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo Wu2200/simple --limit 1000 --json tagName -q '.[].tagName' | while read -r tag; do
            gh release delete "$tag" --repo Wu2200/simple --cleanup-tag -y
          done
          git fetch --tags
          git tag -l | while read -r tag; do
            git push origin ":refs/tags/$tag" || true
          done

      - name: Keep Latest 10 Build Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t build_runs < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')
          for run_id in "${build_runs[@]:10}"; do
            [ -n "$run_id" ] || continue
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "Deleted old Build run ${run_id}"
          done

      - name: Delete Previous Cleanup Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/cleanup.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id' |
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "Deleted previous Cleanup run ${run_id}"
          done
